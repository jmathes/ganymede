# Template Lean project used by Ganymede when a paper arrives without one.
# Aristotle is compatible with Mathlib v4.28.0 (per the Aristotle dashboard, September 2026);
# lean-toolchain must match what that Mathlib tag pins.
name = "paper"
defaultTargets = ["Paper"]

[[lean_lib]]
name = "Paper"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"
